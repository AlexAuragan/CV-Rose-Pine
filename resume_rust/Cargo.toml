[package]
name = "resume_rust"
version = "0.1.0"
edition = "2021"
description = "Rosé Pine resume TUI, ported from the Python/Textual app"

[[bin]]
name = "resume"
path = "src/main.rs"

[dependencies]
ratatui = "=0.28.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
unicode-width = "=0.2.2"
